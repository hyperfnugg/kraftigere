name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      # `tsc -b` builds functions too, and the deploy uploads what it builds.
      - run: npm ci --prefix functions
      - run: npm run build
      # Keyless: GitHub's OIDC token is exchanged for the deploy service account. See docs/adr/0002-firebase-hosting.md.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      # Without --force, a function removed from the source stops the deploy rather than being
      # deleted: run the `firebase functions:delete` it prints, then deploy again.
      - run: npx firebase deploy --only hosting,firestore:rules,functions --project kraftigere --non-interactive
